<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSX // Multi-Video Chat</title>
    
    <!-- Design & UI Typography Styling Links -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    
    <!-- Core External Communication Library CDN Bundles -->
    <script src="https://socket.io"></script>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <!-- Ambient Scenery Atmosphere Layers -->
    <div class="stars"></div>
    <div class="nebula"></div>

    <div class="app-container">
        
        <header>
            <h1 class="brand-title">ECLIPSX</h1>
            <p class="brand-subtitle">Secure WebRTC Mesh Communication</p>
        </header>

        <main>
            <!-- STAGE 1: Authentication Profile Configuration -->
            <div id="view-auth" class="card-view active">
                <h2 class="view-title">Enter Your Name</h2>
                <form onsubmit="return false;">
                    <div class="input-group">
                        <label for="input-username">Username</label>
                        
                    </div>
                    <!-- Added type="button" to fully secure against form submission refreshes -->
                    <button type="button" id="btn-next" class="btn-primary">Next</button>
                </form>
            </div>

            <!-- STAGE 2: Room Routing Selection Panel Dashboard -->
            <div id="view-dashboard" class="card-view">
                <h2 class="view-title">Welcome, <span id="display-user" style="color: #38bdf8;">User</span></h2>
                
                <nav class="tab-controls">
                    <button type="button" id="tab-host" class="tab-btn active">Create Room</button>
                    <button type="button" id="tab-join" class="tab-btn">Join Room</button>
                </nav>

                <!-- Configuration 1: Hosting Options -->
                <div id="panel-host" class="sub-panel active">
                    <form onsubmit="return false;">
                        <div class="input-group">
                            <label for="host-room">New Room Name</label>
                            <input type="text" id="host-room" placeholder="Enter space room name...">
                        </div>
                        <div class="input-group">
                            <label for="host-pass">Access Code</label>
                            <input type="password" id="host-pass" placeholder="Secure room code...">
                        </div>
                        <button type="button" id="btn-host-launch" class="btn-primary">Create</button>
                    </form>
                </div>

                <!-- Configuration 2: Entry Guest Options -->
                <div id="panel-join" class="sub-panel">
                    <form onsubmit="return false;">
                        <div class="input-group">
                            <label for="join-room">Target Room Name</label>
                            <input type="text" id="join-room" placeholder="Enter target room name...">
                        </div>
                        <div class="input-group">
                            <label for="join-pass">Access Code</label>
                            <input type="password" id="join-pass" placeholder="Target entry code...">
                        </div>
                        <button type="button" id="btn-join-launch" class="btn-primary">Join</button>
                    </form>
                </div>

                <p id="error-message" class="error-text"></p>
            </div>

            <!-- STAGE 3: Multi-Video Communication Chat Area -->
            <div id="view-chat" class="card-view layout-chat">
                <div class="room-header">
                    <h2 class="view-title" style="margin-bottom: 0;">Room: <span id="current-room-text" style="color: #38bdf8;">-</span></h2>
                    
                    <div class="filter-controls">
                        <label for="filter" style="font-size: 0.85rem; text-transform: uppercase; margin-right: 0.5rem; color: #94a3b8;">Filter:</label>
                        <select id="filter" class="select-lunar">
                            <option value="none">Normal</option>
                            <option value="grayscale(100%)">B & W</option>
                            <option value="invert(100%)">Eclipse</option>
                            <option value="hue-rotate(180deg)">Cyan</option>
                            <option value="sepia(60%) contrast(90%)">Vintage</option>
                        </select>
                    </div>
                </div>

                <!-- Dynamic Adaptive Layout Grid Container Mapping Interface -->
                <div class="video-grid" id="peerDiv">
                    <!-- Local Operator Camera Card Frame -->
                    <div class="video-wrapper" id="local-video-wrapper">
                        <span class="video-label">You</span>
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>
                    <!-- Target remote peer windows generate dynamically right here -->
                </div>

                <div class="media-controls" style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                    <button type="button" id="btn-toggle-mute" class="btn-primary" style="max-width: 160px; background: #1e293b;">Mute Mic</button>
                    <button type="button" id="btn-toggle-video" class="btn-primary" style="max-width: 160px; background: #1e293b;">Hide Video</button>
                    <button type="button" id="btn-leave-room" class="btn-primary" style="max-width: 160px; background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);">Leave</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Controller Logic Scripts Router Link -->
    <script src="main.js"></script>
</body>
</html>
